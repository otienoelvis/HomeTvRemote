name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Normalize version
        run: |
          v="${VERSION_NAME#v}"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set. Add it (and the other signing secrets) in the repository Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Expected signed APK at $apk (found: $(ls app/build/outputs/apk/release/ 2>/dev/null || echo nothing))"
            exit 1
          fi
          cp "$apk" "dist/HomeTv-$VERSION_NAME.apk"
          (cd dist && shasum -a 256 "HomeTv-$VERSION_NAME.apk" > "HomeTv-$VERSION_NAME.apk.sha256")
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeTv-${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', env.VERSION_NAME) || github.ref_name }}
          name: HomeTv ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}
          files: dist/*
